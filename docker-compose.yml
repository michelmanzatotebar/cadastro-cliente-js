services:
  postgres:
    image: postgres:15
    container_name: cadastro_postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cadastro_clientes
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - app-network

  app:
    build: .
    container_name: cadastro_app
    ports:
      - "3000:3000"
    environment:
      PGUSER: postgres
      PGHOST: postgres
      PGDATABASE: cadastro_clientes
      PGPASSWORD: postgres
      PGPORT: 5432
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - app-network

  # Prometheus para coletar métricas
  prometheus:
    image: prom/prometheus:latest
    container_name: cadastro_prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    depends_on:
      - app
    networks:
      - app-network

  # Grafana para visualização
  grafana:
    image: grafana/grafana:latest
    container_name: cadastro_grafana
    ports:
      - "3001:3000"
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=admin
      - GF_SECURITY_ADMIN_USER=admin
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
      - postgres
    networks:
      - app-network

networks:
  app-network:
    driver: bridge

volumes:
  postgres_data:
  prometheus_data:
  grafana_data: